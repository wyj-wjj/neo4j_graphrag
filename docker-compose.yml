name: neo4j-graphrag

services:
  redis:
    image: redis:8.2.3-bookworm
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  neo4j:
    image: neo4j:5.26.28-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes: ["neo4j-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes: ["etcd-data:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /minio_data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["minio-data:/minio_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-store:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["phase2", "app"]
    command: server /object_data --console-address :9001
    ports: ["9002:9000", "9003:9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:?set OBJECT_STORE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:?set OBJECT_STORE_SECRET_KEY}
    volumes: ["object-store-data:/object_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    profiles: ["phase2"]
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.6.14
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MQ_TYPE: woodpecker
    ports: ["19530:19530", "9091:9091"]
    volumes: ["milvus-data:/var/lib/milvus"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  mysql:
    image: mysql:8.4.7
    profiles: ["mysql", "app"]
    ports: ["3306:3306"]
    environment:
      MYSQL_DATABASE: enterprise_agent_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uapp_user -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mysql+aiomysql://app_user:${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}@mysql:3306/enterprise_agent_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      UPLOAD_DIR: /app/data/uploads
      OBJECT_STORE_BACKEND: s3
      S3_ENDPOINT_URL: http://object-store:9000
      S3_BUCKET: knowledge-originals
      S3_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:?set OBJECT_STORE_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:?set OBJECT_STORE_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      ALLOW_S3_BUCKET_BOOTSTRAP: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    command:
      - sh
      - -c
      - python scripts/ensure_s3_bucket.py && alembic upgrade head && exec uvicorn graphrag.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports: ["8000:8000"]
    volumes: ["upload-data:/app/data/uploads"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      milvus: {condition: service_healthy}
      object-store: {condition: service_healthy}
    restart: unless-stopped

  vector-worker:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: dev
      USE_FAKE_EXTERNAL_CLIENTS: "false"
      DATABASE_URL: mysql+aiomysql://app_user:${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}@mysql:3306/enterprise_agent_db
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      KAFKA_ENABLED: "true"
      OUTBOX_RELAY_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    command: ["graphrag-index-worker", "vector"]
    healthcheck:
      disable: true
    depends_on:
      backend: {condition: service_healthy}
      kafka: {condition: service_healthy}
      milvus: {condition: service_healthy}
    restart: unless-stopped

  graph-worker:
    profiles: ["phase2"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: dev
      USE_FAKE_EXTERNAL_CLIENTS: "false"
      DATABASE_URL: mysql+aiomysql://app_user:${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD}@mysql:3306/enterprise_agent_db
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      KAFKA_ENABLED: "true"
      OUTBOX_RELAY_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    command: ["graphrag-index-worker", "graph"]
    healthcheck:
      disable: true
    depends_on:
      backend: {condition: service_healthy}
      kafka: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build:
      context: frontend
      dockerfile: Dockerfile
    ports: ["8080:8080"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

volumes:
  redis-data:
  neo4j-data:
  etcd-data:
  minio-data:
  object-store-data:
  kafka-data:
  milvus-data:
  mysql-data:
  upload-data:
