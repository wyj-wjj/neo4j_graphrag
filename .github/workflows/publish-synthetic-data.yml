name: publish-synthetic-data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "synthetic-data/**"
      - ".github/workflows/publish-synthetic-data.yml"

permissions:
  contents: write

concurrency:
  group: synthetic-commerce-v1-data-v3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wyj-wjj/neo4j_graphrag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: synthetic-commerce-v1-data-v3
      DEV_ESTIMATED_BYTES: "7091015000"
      FAILURE_ESTIMATED_BYTES: "2941757500"
      DEV_MANIFEST_SHA256: 5bbea39339499703796fe5d9d01fdc8541f4414d11ae3b6f3ad65f30baef7fe2
      FAILURE_MANIFEST_SHA256: 2c64f88dc89625a4b44f504e62c7730cfe6caad003a365c19ac34f1b55d98a60
    defaults:
      run:
        shell: bash
        working-directory: synthetic-data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.9.25", enable-cache: true}
      - run: uv sync --frozen --group dev
      - name: Check immutable release
        id: release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate, validate, and package dev-standard
        if: steps.release.outputs.exists == 'false'
        run: |
          uv run graphrag-data generate \
            --profile dev-standard \
            --allow-large \
            --confirm-profile dev-standard \
            --confirm-estimated-bytes "$DEV_ESTIMATED_BYTES"
          echo "$DEV_MANIFEST_SHA256  generated/synthetic-commerce-v1/dev-standard/manifest.json" \
            | sha256sum -c -
          mkdir -p release-assets
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            -cf release-assets/synthetic-commerce-v1-dev-standard.tar \
            -C generated/synthetic-commerce-v1 dev-standard
          gzip -1 -n -c release-assets/synthetic-commerce-v1-dev-standard.tar \
            > release-assets/synthetic-commerce-v1-dev-standard.tar.gz
          gzip -t release-assets/synthetic-commerce-v1-dev-standard.tar.gz
          sha256sum release-assets/synthetic-commerce-v1-dev-standard.tar.gz
          echo "DEV_ARCHIVE_SHA256=$(sha256sum release-assets/synthetic-commerce-v1-dev-standard.tar.gz | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"
          rm -f release-assets/synthetic-commerce-v1-dev-standard.tar
          rm -rf generated/synthetic-commerce-v1/dev-standard
      - name: Generate, validate, and package failure-lab
        if: steps.release.outputs.exists == 'false'
        run: |
          uv run graphrag-data generate \
            --profile failure-lab \
            --allow-large \
            --confirm-profile failure-lab \
            --confirm-estimated-bytes "$FAILURE_ESTIMATED_BYTES"
          echo "$FAILURE_MANIFEST_SHA256  generated/synthetic-commerce-v1/failure-lab/manifest.json" \
            | sha256sum -c -
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            -cf release-assets/synthetic-commerce-v1-failure-lab.tar \
            -C generated/synthetic-commerce-v1 failure-lab
          gzip -1 -n -c release-assets/synthetic-commerce-v1-failure-lab.tar \
            > release-assets/synthetic-commerce-v1-failure-lab.tar.gz
          gzip -t release-assets/synthetic-commerce-v1-failure-lab.tar.gz
          sha256sum release-assets/synthetic-commerce-v1-failure-lab.tar.gz
          echo "FAILURE_ARCHIVE_SHA256=$(sha256sum release-assets/synthetic-commerce-v1-failure-lab.tar.gz | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"
          rm -f release-assets/synthetic-commerce-v1-failure-lab.tar
          rm -rf generated/synthetic-commerce-v1/failure-lab
      - name: Write release checksum files
        if: steps.release.outputs.exists == 'false'
        run: |
          printf '%s  %s\n%s  %s\n' \
            "$DEV_ARCHIVE_SHA256" synthetic-commerce-v1-dev-standard.tar.gz \
            "$FAILURE_ARCHIVE_SHA256" synthetic-commerce-v1-failure-lab.tar.gz \
            > release-assets/SHA256SUMS
          printf '%s  %s\n%s  %s\n' \
            "$DEV_MANIFEST_SHA256" dev-standard/manifest.json \
            "$FAILURE_MANIFEST_SHA256" failure-lab/manifest.json \
            > release-assets/MANIFEST-SHA256SUMS
      - name: Publish immutable data release
        if: steps.release.outputs.exists == 'false'
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/synthetic-commerce-v1-dev-standard.tar.gz \
            release-assets/synthetic-commerce-v1-failure-lab.tar.gz \
            release-assets/SHA256SUMS \
            release-assets/MANIFEST-SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Synthetic commerce v1 data (generator v3)" \
            --notes-file release/README.md
      - name: Verify release assets
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx synthetic-commerce-v1-dev-standard.tar.gz
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx synthetic-commerce-v1-failure-lab.tar.gz
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx SHA256SUMS
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fx MANIFEST-SHA256SUMS
